name: Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained EXE
        run: dotnet publish TurboSafeOptimizer/TurboSafeOptimizer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path TurboSafeOptimizer/bin/Release/net8.0-windows/win-x64/publish/* -DestinationPath TurboSafeOptimizer-win-x64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboSafeOptimizer-win-x64
          path: TurboSafeOptimizer-win-x64.zip
