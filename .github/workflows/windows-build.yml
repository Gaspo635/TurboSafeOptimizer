name: Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TurboSafeOptimizer/TurboSafeOptimizer.csproj

      - name: Build
        run: dotnet build TurboSafeOptimizer/TurboSafeOptimizer.csproj -c Release --no-restore

      - name: Publish self-contained EXE
        run: dotnet publish TurboSafeOptimizer/TurboSafeOptimizer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --no-restore

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "TurboSafeOptimizer/bin/Release/net8.0-windows/win-x64/publish/TurboSafeOptimizer.exe"
          if (!(Test-Path $exe)) { throw "No se encontró TurboSafeOptimizer.exe" }
          Get-Item $exe | Select-Object FullName,Length

      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path "TurboSafeOptimizer/bin/Release/net8.0-windows/win-x64/publish/*" -DestinationPath "TurboSafeOptimizer-win-x64.zip" -Force

      - name: Upload EXE package
        uses: actions/upload-artifact@v4
        with:
          name: TurboSafeOptimizer-win-x64
          path: TurboSafeOptimizer-win-x64.zip
          if-no-files-found: error
          retention-days: 30
