name: Build iClover Tweaks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TurboSafeOptimizer/TurboSafeOptimizer.csproj

      - name: Build single EXE
        run: dotnet publish TurboSafeOptimizer/TurboSafeOptimizer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "TurboSafeOptimizer/bin/Release/net8.0-windows/win-x64/publish/iCloverTweaks.exe"
          if (!(Test-Path $exe)) { throw "iCloverTweaks.exe was not produced." }
          Write-Host "Verified: $exe"
          Get-Item $exe | Select-Object FullName, Length

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" "TurboSafeOptimizer/bin/Release/net8.0-windows/win-x64/publish/iCloverTweaks.exe" --title "iClover Tweaks $TAG" --notes "Windows 10/11 x64 single-file executable."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iCloverTweaks
          path: TurboSafeOptimizer/bin/Release/net8.0-windows/win-x64/publish/iCloverTweaks.exe
